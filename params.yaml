# ==============================================================================
# AUTO-ECON-SENTIMENT PIPELINE CONFIGURATION
# Consumed by: src/auto_econ_sentiment/pipeline.py
# ==============================================================================

# ------------------------------------------------------------------------------
# INPUT
# Source file plus the text and date columns to read from it.
# ------------------------------------------------------------------------------
input:
  file_path: "data/raw/basic_tests/monetary_policy_statement.parquet.gzip"
  text_column: text
  date_column: date

# ------------------------------------------------------------------------------
# OUTPUT
# Destination directory for exported sentiment tables.
# ------------------------------------------------------------------------------
output:
  export_path: data/sentiment/basic_tests/
  export_results: true

# ------------------------------------------------------------------------------
# CLEANING
# Text normalization applied before any scoring: HTML stripping, number and
# percentage handling, boilerplate header removal, tokenization and stemming.
# ------------------------------------------------------------------------------
cleaning:
  clean_html: true
  clean_numbers_percentages: true
  remove_headers: [
     'For immediate release',
     'The Federal Reserve, the central bank of the United States, provides the nation with a safe, flexible, and stable monetary and financial system. Federal Open Market Committee Monetary Policy Principles and Practice Policy Implementation Reports Review of Monetary Policy Strategy, Tools, and Communications Institution Supervision Reports Reporting Forms Supervision & Regulation Letters Banking Applications & Legal Developments Regulatory Resources Banking & Data Structure Financial Stability Assessments Financial Stability Coordination & Actions Reports Regulations & Statutes Payment Policies Reserve Bank Payment Services & Data Financial Market Utilities & Infrastructures Research, Reports, & Committees Working Papers and Notes Data, Models and Tools Bank Assets and Liabilities Bank Structure Data Business Finance Dealer Financing Terms Exchange Rates and International Data Financial Accounts Household Finance Industrial Activity Interest Rates Micro Data Reference Manual \(MDRM\) Money Stock and Reserve Balances Other Regulations Supervision& Enforcement Community Development Research& Analysis Consumer Resources',
     'Federal Open Market Committee Monetary Policy Principles and Practice Policy Implementation Reports Review of Monetary Policy Strategy, Tools, and Communications Institution Supervision Reports Reporting Forms Supervision & Regulation Letters Banking Applications & Legal Developments Regulatory Resources Banking & Data Structure Financial Stability Assessments Financial Stability Coordination & Actions Reports Regulations & Statutes Payment Policies Reserve Bank Payment Services & Data Financial Market Utilities & Infrastructures Research, Reports, & Committees Working Papers and Notes Data, Models and Tools Bank Assets and Liabilities Bank Structure Data Business Finance Dealer Financing Terms Exchange Rates and International Data Financial Accounts Household Finance Industrial Activity Interest Rates Micro Data Reference Manual (MDRM) Money Stock and Reserve Balances Other Regulations Supervision& Enforcement Community Development Research& Analysis Consumer Resources'
  ]
  tokenize: true
  stem: true

# ------------------------------------------------------------------------------
# LEXICAL SENTIMENT
# Dictionary-based scoring. Dictionaries are split by whether they are matched
# against stemmed or unstemmed tokens.
# ------------------------------------------------------------------------------
lexical:
  #text_column_lexical: 'text_clean'
  dictionaries:
    unstemmed: [correa, hubert, lm, hiv]
    stemmed: [bn, ap]
  aggregation_methods: [posneg, allwords]

# ------------------------------------------------------------------------------
# TRANSFORMER SENTIMENT
# Optional Hugging Face scoring; requires `uv sync --extra transformers`.
# Set `enabled: true` to activate. Settings here apply to every model in the
# `models` list below, and any model may override them individually.
# ------------------------------------------------------------------------------
transformer:
  enabled: false
  text_column_transformer: text_clean
  aggregation_methods: [bysentence]
  output_schema: shares
  net_sentiment_formula: positive_minus_negative
  # Sentence-aggregation settings (used when aggregation_methods includes bysentence).
  # Both can be overridden per model in the models list below.
  min_sentence_chars: 20
  sentence_probability_cutoff: 0.7
  models:
    - name: gtfintechlab/FOMC-RoBERTa
      short_name: fomc
      num_labels: 3
      max_length: 512
      batch_size: 8
      label_mapping:
        LABEL_0: positive
        LABEL_1: negative
        LABEL_2: neutral
      sentiment_values:
        positive: 1
        negative: -1
        neutral: 0

    - name: gtfintechlab/model_WCB_stance_label
      short_name: gtstance
      num_labels: 4
      max_length: 512
      batch_size: 8
      label_mapping:
        LABEL_0: negative
        LABEL_1: positive
        LABEL_2: neutral
        LABEL_3: irrelevant
      sentiment_values:
        negative: 1
        positive: -1
        neutral: 0
        irrelevant: 0

    - name: Moritz-Pfeifer/CentralBankRoBERTa-sentiment-classifier
      short_name: cbroberta
      num_labels: 2
      max_length: 512
      batch_size: 8
      label_mapping:
        positive: positive
        negative: negative
      sentiment_values:
        positive: 1
        negative: -1

    - name: ProsusAI/finbert
      short_name: finbertpro
      num_labels: 3
      max_length: 512
      batch_size: 8
      label_mapping:
        neutral: neutral
        positive: positive
        negative: negative
      sentiment_values:
        neutral: 0
        positive: 1
        negative: -1

    - name: yiyanghkust/finbert-tone
      short_name: finbertyi
      num_labels: 3
      max_length: 512
      batch_size: 8
      label_mapping:
        Neutral: neutral
        Positive: positive
        Negative: negative
      sentiment_values:
        neutral: 0
        positive: 1
        negative: -1
